name: Quick Docker Compose Check

on:
  push:
    paths:
      - 'docker-compose*.yml'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'nginx/**'
  pull_request:
    paths:
      - 'docker-compose*.yml'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'nginx/**'

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate docker-compose.yml syntax
      run: |
        echo "Validating docker-compose.yml..."
        docker compose -f docker-compose.yml config --quiet

    - name: Validate docker-compose.prod.yml syntax
      run: |
        echo "Validating docker-compose.prod.yml..."
        docker compose -f docker-compose.prod.yml config --quiet

    - name: Check Dockerfile syntax
      run: |
        echo "Checking backend Dockerfile..."
        docker build --no-cache -f backend/Dockerfile backend --dry-run 2>/dev/null || docker build -f backend/Dockerfile backend -t test-backend --no-cache --target deps
        
        echo "Checking frontend Dockerfile..."
        docker build --no-cache -f frontend/Dockerfile frontend --dry-run 2>/dev/null || docker build -f frontend/Dockerfile frontend -t test-frontend --no-cache --target deps
        
        echo "Checking nginx Dockerfile..."
        docker build --no-cache -f nginx/Dockerfile nginx -t test-nginx

    - name: Validate nginx configuration
      run: |
        echo "Testing nginx configuration syntax..."
        docker run --rm -v $(pwd)/nginx/nginx.conf:/etc/nginx/conf.d/default.conf nginx:alpine nginx -t